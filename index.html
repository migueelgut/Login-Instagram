<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>Instagram</h1>
            <form action="login" method="POST">
                <input type="text" id="username" name="username"
                       placeholder="Número de celular, nombre de usuario o correo electrónico" required>

                <input type="password" id="password" name="password"
                       placeholder="Contraseña" required>

                <button type="submit">Iniciar sesión</button>

                <div class="separador">O</div>

                <button type="button" class="fb-login">Iniciar sesión con Facebook</button>
                <button type="button" class="olvide">¿Olvidaste tu contraseña?</button>
            </form>
        </div>

        <div class="registro-box">
            <p>¿No tienes una cuenta? <button type="button" class="link-registro">Regístrarse</button></p>
        </div>
    </div>
</body>
</html>
